<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea" />
      <stop offset="100%" style="stop-color:#4f46e5" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Outer rings (static versions of animate-pulse borders) -->
  <circle cx="256" cy="256" r="250" stroke="#f3e8ff" stroke-width="4" fill="none" opacity="0.3" />
  <circle cx="256" cy="256" r="230" stroke="#e9d5ff" stroke-width="6" fill="none" opacity="0.5" />
  
  <!-- Main Background Circle -->
  <circle cx="256" cy="256" r="200" fill="url(#bgGradient)" />
  
  <!-- Inner Highlight Layer -->
  <circle cx="256" cy="256" r="200" fill="url(#innerGradient)" />
  
  <!-- Centered Lightning Bolt (Lucide Zap Path) -->
  <g transform="translate(116, 116) scale(11.66)">
    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" 
          stroke="white" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
